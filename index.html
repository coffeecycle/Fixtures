<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Club Fixtures</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .page {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>Club Fixtures</h1>

    <p>Club</p>

    <select>
      <option>Arsenal</option>
      <option>Liverpool</option>
      <option>Barcelona</option>
    </select>

    <p>Timezone</p>

    <select>
      <option>Sydney</option>
      <option>London</option>
      <option>New York</option>
    </select>

    <h2>Upcoming fixtures</h2>

    <p>Fixtures will appear here.</p>

  </div>

</body>
</html>
