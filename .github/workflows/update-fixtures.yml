name: Update fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: update-fixtures
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update fixtures
        run: python update_fixtures.py

      - name: Save fixtures
        run: |
          git config user.name "fixture-bot"
          git config user.email "fixture-bot@users.noreply.github.com"
          git add fixtures.json

          if git diff --cached --quiet; then
            echo "No fixture changes"
            exit 0
          fi

          git commit -m "Update fixtures"
          git pull --rebase origin main
          git push origin HEAD:main
